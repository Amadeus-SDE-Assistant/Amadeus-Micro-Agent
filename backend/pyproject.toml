[project]
name = "amadeus-backend"
version = "0.1.0"
description = "Amadeus Micro Agent backend — FastAPI + Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "claude-agent-sdk>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "fpdf2>=2.8.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's formatting.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires running Postgres (docker compose up -d db)",
    "eval: costs tokens; run explicitly with -m eval",
]
addopts = "-m 'not eval'"
